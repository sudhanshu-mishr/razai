<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ff3377;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3003b;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#050505" rx="100"/>

  <path d="M256,128 c-70,0 -128,58 -128,128 s58,128 128,128 s128,-58 128,-128 s-58,-128 -128,-128 z"
        fill="url(#grad1)"
        filter="url(#glow)"/>

  <path d="M200,220 a 30 30 0 0 1 60 0" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
  <path d="M250,220 a 30 30 0 0 1 60 0" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>

  <!-- "Slap" lines representing motion/sound waves -->
  <path d="M100,256 l 30,0" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  <path d="M382,256 l 30,0" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  <path d="M256,100 l 0,30" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  <path d="M256,382 l 0,30" stroke="#fff" stroke-width="20" stroke-linecap="round"/>

  <text x="50%" y="360" font-family="sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">SLAP</text>
</svg>
